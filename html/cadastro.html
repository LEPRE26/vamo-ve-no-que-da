    <section class="page4" id="cadastro">
  <h1 class="t1">Cadastro</h1>

  <div class="cadastro-container">
    <form class="cadastro-form">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite o e-mail">
      </div>

      <div class="campo">
        <label for="tipo">Tipo de usuário</label>
        <select id="tipo" name="tipo">
          <option value="">Selecione...</option>
          <option value="admin">Administrador</option>
          <option value="operador">Operador</option>
          <option value="visualizador">Visualizador</option>
        </select>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha">
      </div>

      <div class="botoes-cadastro">
        <button type="reset" class="btn-info1">Limpar</button>
        <button type="submit" class="btn-gerenc1">Cadastrar</button>
      </div>
    </form>
  </div>
